    <style>#preloader {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background-color: #f0e6da;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

#preloader img {
  width: 240px;
  height: auto;
  justify-content: center;   /* Центруємо по горизонталі */
    align-items: center;
}

#preloader.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}</style>

      href="../Icon/Iconembleme.svg"
